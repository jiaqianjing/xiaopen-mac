name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        # mlx-audio-swift requires Swift tools 6.2 or newer.
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Test
        run: swift test --parallel
